# PSP Hardware Dithering - framebuffer color depth and GE dithering for PPSSPP hardware rendering.
#
# Use hardware rendering at 2x (or higher) rendering resolution and put it last in the chain.
# Color shaders such as Natural Colors or PSP Color may go before it.
#
# Each preset is two passes: the hidden one dithers at render resolution and holds the
# sliders, the visible one scales the result pixel-exactly to the screen.
#   Color depth : 0 = 32-bit 8888, 1 = 16-bit 565, 2 = 15-bit 5551, 3 = 12-bit 4444, 4 = 8-bit 332
#   Dither      : 0 = off, 1 = PSP GE matrix, 2 = PSP GE matrix written twice (games with a
#                 dithered full screen pass, like MGS Peace Walker's bloom), 3 = Bayer 2x2, 4 = Bayer 4x4
#   Pixels      : 0 = hi-res + PSP-grid dither, 1 = hi-res + render-grid dither,
#                 2 = native 480x272 supersampled, 3 = native 480x272 supersampled + render-grid dither,
#                 4 = native 480x272 point sampled
#   Dither blur : Gaussian blur of the dither pattern only, 0-1 for a radius of 0-1.5 PSP pixels (0 = off)
#
# FMVs are never dithered, like on hardware. Rotated displays and stereo (SBS / TAB) are handled.

